name: Replicarr
version: "0.2.0"
slug: replicarr
description: A dashboard to manage and sync multiple Syncthing instances from one place.
url: https://github.com/Fully-Local-Admin/replicarr
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:sync
panel_title: Replicarr
apparmor: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Web UI (for access outside Home Assistant)
options:
  log_level: info
  instances: []
  basic_auth_username: ""
  basic_auth_password: ""
schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"
  instances:
    - name: str
      url: url
      api_key: password
  basic_auth_username: "str?"
  basic_auth_password: "password?"
