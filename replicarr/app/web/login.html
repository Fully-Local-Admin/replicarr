<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Sign in · Replicarr</title>
  <style>
    :root { color-scheme: light; --bg:#f2f3f7; --surface:#fff; --border:#d1d5db; --text:#111827; --muted:#6b7280; --accent:#3b5bdb; --error:#b42318; --error-bg:#fee4e2; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --bg:#0f1117; --surface:#1a1d27; --border:#363945; --text:#f0f1f5; --muted:#8b8fa8; --accent:#7b8ef0; --error:#fda29b; --error-bg:#2b0f0f; }
    }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:20px; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(400px,100%); padding:28px; border:1px solid var(--border); border-radius:14px; background:var(--surface); box-shadow:0 20px 50px rgba(0,0,0,.14); }
    .brand { display:flex; align-items:center; gap:9px; color:var(--accent); font-size:18px; font-weight:750; }
    h1 { margin:24px 0 5px; font-size:22px; }
    .intro { margin:0 0 22px; color:var(--muted); font-size:13px; }
    label { display:block; margin:14px 0 5px; color:var(--muted); font-size:12px; font-weight:650; }
    input { width:100%; height:42px; padding:0 12px; border:1px solid var(--border); border-radius:7px; background:var(--surface); color:var(--text); font:inherit; }
    input:focus { border-color:var(--accent); outline:3px solid color-mix(in srgb,var(--accent) 20%,transparent); }
    button { width:100%; height:42px; margin-top:20px; border:0; border-radius:7px; background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    .error { display:none; margin:0 0 14px; padding:10px 12px; border-radius:7px; background:var(--error-bg); color:var(--error); font-size:12px; }
    .error.visible { display:block; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
      Replicarr
    </div>
    <h1>Sign in</h1>
    <p class="intro">Use the direct-access credentials configured in the Home Assistant add-on.</p>
    <div class="error" id="login-error" role="alert"></div>
    <form method="post" action="login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
    </form>
  </main>
  <script>
    const messages = {
      invalid: "The username or password is incorrect.",
      locked: "Too many failed attempts. Try again in 15 minutes.",
      https: "Direct sign-in requires HTTPS. Open Replicarr using its secure HTTPS address."
    };
    const reason = new URLSearchParams(location.search).get("error");
    if (messages[reason]) {
      const error = document.getElementById("login-error");
      error.textContent = messages[reason];
      error.classList.add("visible");
    }
  </script>
</body>
</html>
